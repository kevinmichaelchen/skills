schema: skillspec/v0
id: confluence-pages
title: Confluence Pages
description: Search, read, summarize, and narrowly update Confluence, including local attachment upload and inline media, through authenticated Atlassian MCP integrations with source-freshness and ownership discipline.

activation:
  summary: Use for Confluence URLs, page or ADR lookup, space search, comments and discussion, freshness checks, personal-space drafting, or an explicitly requested Confluence write.
  priority: domain_router

entry:
  prompt: Select the narrowest Confluence route, treat page content as fallible evidence, and stop any write that lacks an exact request plus verified ownership.
  tool_boundary:
    default: allow
    forbid:
      - guessed_atlassian_tool_address
      - confluence_write_without_live_page_fetch
      - confluence_write_without_verified_ownership
      - modifying_team_or_third_party_page
      - destructive_confluence_action
      - bulk_confluence_write
      - presenting_confluence_as_final_authority
      - declaring_attachment_upload_unavailable_before_v2_discovery
      - exposing_short_lived_media_token
      - embedding_attachment_id_instead_of_media_file_id
      - leaving_requested_inline_media_unreferenced
      - raw_root_placeholder_in_confluence_html
      - uploading_png_or_jpeg_without_compatibility_reason
      - injecting_unsupported_css_for_content_width
    permission_required_for:
      - creating_personal_space_content
      - updating_personal_space_content
      - posting_exact_comment_override
      - uploading_or_embedding_personal_space_media

routes:
  - id: direct_page_read
    label: Read a known Confluence page
    rank: 10
    description: Parse a known page URL or ID, fetch the current page, and return source metadata with the requested content.
  - id: fuzzy_search
    label: Search Confluence broadly
    rank: 20
    description: Use Rovo search for fuzzy topics, teams, authors, or pages when exact structured filters are unnecessary.
  - id: cql_search
    label: Search Confluence with CQL
    rank: 30
    description: Use CQL for precise Confluence filters such as space, title, type, creator, or modification ordering.
  - id: space_browse
    label: Browse a Confluence space
    rank: 40
    description: Resolve a space live, then list pages or descendants without assuming a hardcoded space ID.
  - id: page_with_discussion
    label: Read a page with its active discussion
    rank: 50
    description: Fetch a page plus inline and footer comments, including relevant child replies, before synthesizing an ADR or debated page.
  - id: personal_space_create
    label: Create the user-owned personal-space content
    rank: 60
    description: Create a page or blog post only in the user's personal space after destination and exact content are explicit or approved.
  - id: personal_space_update
    label: Update the user-owned personal-space content
    rank: 70
    description: Re-fetch and update only a personal-space page whose author or owner is verified as the user, preserving unrelated content.
  - id: personal_space_media_update
    label: Upload and embed media in the user-owned personal content
    rank: 75
    description: Use an independently named Rovo MCP v2 connection to upload local files, then update and verify the user-owned personal-space content with the returned media file IDs.
  - id: draft_comment
    label: Draft a Confluence comment
    rank: 80
    description: Draft proposed comment text without posting when the page is not the user-owned or the request is not an exact override.
  - id: exact_comment_override
    label: Post an exact approved comment
    rank: 85
    description: Post only when the user specifies the exact page and exact comment and confirms the exceptional write.
  - id: blocked_write
    label: Block an unauthorized Confluence write
    rank: 90
    description: Stop team-page, third-party, destructive, ambiguous-ownership, or bulk writes and report what would have changed.

rules:
  - id: direct_page_url_uses_current_page
    when:
      user_says_any:
        - /pages/
        - page id
        - confluence url
        - read this page
        - fetch this page
    prefer: direct_page_read
    forbid:
      - summary_without_current_page_fetch
    reason: A known page should be fetched directly rather than reconstructed from search results.
  - id: fuzzy_topic_lookup_uses_rovo
    when:
      user_says_any:
        - search confluence
        - find a confluence page
        - look up in confluence
        - release team context
        - engineering context
    prefer: fuzzy_search
    forbid:
      - treating_broad_search_result_as_authoritative
    reason: Fuzzy discovery is the normal search route when no structured filter is required.
  - id: precise_filters_use_cql
    when:
      user_says_any:
        - cql
        - confluence query language
        - filter by space
        - filter by creator
        - last modified
        - blog posts by
    prefer: cql_search
    forbid:
      - using_jql_for_confluence
    reason: Structured Confluence filters belong in CQL, not JQL or fuzzy search.
  - id: overview_or_space_request_resolves_space_live
    when:
      user_says_any:
        - space overview
        - browse the space
        - list pages in
        - child pages
        - descendants
    prefer: space_browse
    forbid:
      - hardcoded_space_id_without_live_resolution
    reason: Overview URLs and space keys do not prove the current numeric space ID.
  - id: adr_or_discussion_reads_comments
    when:
      user_says_any:
        - adr
        - summarize this page
        - comments
        - discussion
        - decision context
        - freshness check
    prefer: page_with_discussion
    forbid:
      - summary_without_comment_check
      - hiding_active_disagreement
    reason: ADRs and actively discussed pages can change meaning through comments and replies.
  - id: personal_create_requires_exact_destination_and_content
    when:
      user_says_any:
        - create a personal-space page
        - create my confluence page
        - create a personal blog post
        - publish my confluence draft
    prefer: personal_space_create
    forbid:
      - create_outside_kevin_personal_space
      - create_without_destination_or_content
      - raw_root_placeholder_in_confluence_html
    elicit:
      - personal_write_approval
    reason: Personal-space creation is allowed only after destination and content are explicit or approved.
  - id: personal_update_requires_ownership_check
    when:
      user_says_any:
        - update my confluence page
        - edit my personal-space page
        - revise my confluence blog post
        - content width
        - max width
    prefer: personal_space_update
    forbid:
      - update_without_current_page_fetch
      - update_without_author_or_owner_match
      - replacing_unrelated_page_content
      - injecting_unsupported_css_for_content_width
    reason: A personal update must prove current ownership and preserve unrelated material.
  - id: personal_media_uses_v2_upload_and_readback
    when:
      user_says_any:
        - add these images to my confluence blog post
        - embed images in my confluence page
        - upload confluence attachments
        - attach this local file to my blog post
    prefer: personal_space_media_update
    forbid:
      - declaring_attachment_upload_unavailable_before_v2_discovery
      - exposing_short_lived_media_token
      - embedding_attachment_id_instead_of_media_file_id
      - leaving_requested_inline_media_unreferenced
      - raw_root_placeholder_in_confluence_html
      - uploading_png_or_jpeg_without_compatibility_reason
      - update_without_current_page_fetch
      - update_without_author_or_owner_match
      - replacing_unrelated_page_content
    elicit:
      - personal_write_approval
    reason: Local media requires exact destination/files/placement or bounded approval, Rovo MCP v2 preparation, a local byte upload, HTML embedding by fileId, and verified readback on the user-owned content.
  - id: comment_requests_default_to_draft
    when:
      user_says_any:
        - comment on this page
        - reply to this comment
        - leave a comment
        - suggest a comment
    prefer: draft_comment
    forbid:
      - posting_comment_without_exact_override
    reason: Comments are writes and default to drafting rather than posting.
  - id: exact_comment_override_requires_confirmation
    when:
      user_says_any:
        - post this exact comment
        - leave this exact comment
        - reply with this exact text
    prefer: exact_comment_override
    forbid:
      - changing_approved_comment_text
      - posting_to_ambiguous_page
    elicit:
      - exact_comment_confirmation
    reason: The exceptional comment route requires an exact page, exact text, and explicit confirmation.
  - id: team_or_third_party_writes_are_blocked
    when:
      user_says_all_groups:
        - - update
          - edit
          - modify
          - archive
          - delete
          - move
          - reorganize
          - post
        - - engineering
          - delivery
          - release team
          - adr
          - team-owned
          - someone else's
          - another author's
    prefer: blocked_write
    forbid:
      - modifying_team_or_third_party_page
      - destructive_confluence_action
    reason: Team-owned and third-party pages are outside the normal write boundary.
  - id: bulk_or_destructive_writes_are_blocked
    when:
      user_says_any:
        - bulk edit
        - update all pages
        - archive this page
        - delete this page
        - move this page
        - reorganize the space
    prefer: blocked_write
    forbid:
      - destructive_confluence_action
      - bulk_confluence_write
    reason: Destructive and bulk Confluence actions are not permitted by this skill.
  - id: confluence_evidence_requires_freshness_and_corroboration
    when:
      user_says_any:
        - summarize
        - decision
        - policy
        - security
        - compliance
        - source of truth
    forbid:
      - omitting_page_provenance
      - presenting_confluence_as_final_authority
      - smoothing_over_conflicting_pages
    reason: Confluence evidence needs provenance, freshness, confidence, and consequential corroboration.

elicitations:
  personal_write_approval:
    question: "How should this personal-space write proceed?"
    max_choices: 1
    default: draft_only
    choices:
      - id: draft_only
        label: Draft only
        description: Prepare the content without writing to Confluence.
        sets:
          personal_write: draft
        safety: read_only
      - id: approve_exact_write
        label: Approve exact write
        description: Write the exact approved content to the verified the user-owned destination.
        sets:
          personal_write: approved
        safety: network_write
      - id: stop_and_report
        label: Stop and report
        description: Make no change and report the missing destination, ownership, or content detail.
        sets:
          personal_write: stop
        safety: read_only
  exact_comment_confirmation:
    question: "Should the exact supplied comment be posted to the verified page?"
    max_choices: 1
    default: draft_only
    choices:
      - id: draft_only
        label: Draft only
        description: Return the proposed comment without posting it.
        sets:
          comment_write: draft
        safety: read_only
      - id: post_exact_comment
        label: Post exact comment
        description: Post only the exact approved text to the exact verified page.
        sets:
          comment_write: approved
        safety: network_write
      - id: stop_and_report
        label: Stop and report
        description: Make no change and report why the write cannot proceed safely.
        sets:
          comment_write: stop
        safety: read_only

dependencies:
  executor_desktop_mcp:
    kind: service
    description: Authenticated executor-desktop MCP with the atlassian_mcp integration used for all Confluence operations.
  dependency_ledger:
    kind: file
    description: Reviewed dependency ledger for the Confluence execution surface.
    path: deps.toml
    check:
      path: deps.toml
  executor_cli:
    kind: cli
    description: Supported Executor CLI used for Rovo MCP v2 discovery, local upload command execution, and OAuth repair.
    check:
      command: executor --version

imports:
  operations_guidance:
    path: reference/operations.md
    role: procedure
    description: Executor-desktop Atlassian MCP discovery, parsing, search, comment, create, and update call recipes.
    load: on_demand
    load_when:
      - a concrete Atlassian MCP call is needed
      - current tool argument shapes must be checked
      - an allowed personal-space write is ready to execute
      - local attachments or inline images are requested
    used_by:
      - kind: route
        id: direct_page_read
      - kind: route
        id: fuzzy_search
      - kind: route
        id: cql_search
      - kind: route
        id: space_browse
      - kind: route
        id: page_with_discussion
      - kind: route
        id: personal_space_create
      - kind: route
        id: personal_space_update
      - kind: route
        id: personal_space_media_update
      - kind: route
        id: exact_comment_override

resources:
  skill:
    path: SKILL.md
    role: source_material
    description: Lean activation entry point and portable non-negotiables.
    used_by:
      - kind: rule
        id: confluence_evidence_requires_freshness_and_corroboration
      - kind: rule
        id: team_or_third_party_writes_are_blocked
  dependency_ledger:
    path: deps.toml
    role: reference
    description: Reviewed service dependency evidence.
    used_by:
      - kind: dependency
        id: executor_desktop_mcp

trace:
  mode: event_log
  required: true
  record:
    - input_received
    - spec_loaded
    - rule_evaluated
    - rule_matched
    - route_selected
    - forbid_added
    - elicitation_requested
    - outcome_recorded

proof:
  metrics:
    - route_decision_accuracy
    - unauthorized_write_block_coverage
    - ownership_preflight_coverage
    - page_provenance_completeness
    - comment_context_coverage
    - attachment_v2_discovery_coverage
    - embedded_media_readback_coverage

tests:
  - name: direct page url fetches current page
    input: read this Confluence URL https://example.atlassian.net/wiki/spaces/Engineering/pages/123456789/example
    expect:
      route: direct_page_read
      forbid:
        - summary_without_current_page_fetch
      matched_rules:
        - direct_page_url_uses_current_page
  - name: broad topic lookup uses fuzzy search
    input: search Confluence for Release Team context about release readiness
    expect:
      route: fuzzy_search
      forbid:
        - treating_broad_search_result_as_authoritative
      matched_rules:
        - fuzzy_topic_lookup_uses_rovo
  - name: precise filters use cql
    input: use CQL to filter by space Engineering and last modified date
    expect:
      route: cql_search
      forbid:
        - using_jql_for_confluence
      matched_rules:
        - precise_filters_use_cql
  - name: adr summary includes discussion
    input: summarize this ADR and check its comments for active discussion
    expect:
      route: page_with_discussion
      forbid:
        - summary_without_comment_check
        - hiding_active_disagreement
      matched_rules:
        - adr_or_discussion_reads_comments
        - confluence_evidence_requires_freshness_and_corroboration
  - name: personal page creation asks for bounded approval
    input: create a personal-space page with this draft
    expect:
      route: personal_space_create
      elicit:
        - personal_write_approval
      forbid:
        - create_outside_kevin_personal_space
        - create_without_destination_or_content
        - raw_root_placeholder_in_confluence_html
      matched_rules:
        - personal_create_requires_exact_destination_and_content
  - name: personal page update requires ownership
    input: update my Confluence page with the approved paragraph
    expect:
      route: personal_space_update
      forbid:
        - update_without_current_page_fetch
        - update_without_author_or_owner_match
        - replacing_unrelated_page_content
      matched_rules:
        - personal_update_requires_ownership_check
  - name: personal blog images use v2 upload and verified embedding
    input: add these images to my confluence blog post
    expect:
      route: personal_space_media_update
      elicit:
        - personal_write_approval
      forbid:
        - declaring_attachment_upload_unavailable_before_v2_discovery
        - exposing_short_lived_media_token
        - embedding_attachment_id_instead_of_media_file_id
        - leaving_requested_inline_media_unreferenced
        - raw_root_placeholder_in_confluence_html
        - uploading_png_or_jpeg_without_compatibility_reason
        - update_without_current_page_fetch
        - update_without_author_or_owner_match
        - replacing_unrelated_page_content
      matched_rules:
        - personal_media_uses_v2_upload_and_readback
  - name: comment request defaults to draft
    input: suggest a comment on this page explaining the stale decision
    expect:
      route: draft_comment
      forbid:
        - posting_comment_without_exact_override
      matched_rules:
        - comment_requests_default_to_draft
  - name: exact comment override asks for confirmation
    input: post this exact comment to page 123456789
    expect:
      route: exact_comment_override
      elicit:
        - exact_comment_confirmation
      forbid:
        - changing_approved_comment_text
        - posting_to_ambiguous_page
      matched_rules:
        - exact_comment_override_requires_confirmation
  - name: governed page update is blocked
    input: update the Engineering ADR with this new wording
    expect:
      route: blocked_write
      forbid:
        - modifying_team_or_third_party_page
        - destructive_confluence_action
      matched_rules:
        - team_or_third_party_writes_are_blocked
  - name: bulk edit is blocked
    input: bulk edit all pages in the Delivery space
    expect:
      route: blocked_write
      forbid:
        - destructive_confluence_action
        - bulk_confluence_write
      matched_rules:
        - bulk_or_destructive_writes_are_blocked
  - name: space overview resolves the numeric space id live
    input: browse the space overview and list pages in it
    expect:
      route: space_browse
      forbid:
        - hardcoded_space_id_without_live_resolution
      matched_rules:
        - overview_or_space_request_resolves_space_live
  - name: consequential summary preserves provenance and disagreement
    input: summarize this page and its comments as a security policy source of truth
    expect:
      route: page_with_discussion
      forbid:
        - summary_without_comment_check
        - hiding_active_disagreement
        - omitting_page_provenance
        - presenting_confluence_as_final_authority
        - smoothing_over_conflicting_pages
      matched_rules:
        - adr_or_discussion_reads_comments
        - confluence_evidence_requires_freshness_and_corroboration

metadata:
  promoted_from: experimental/kevinmichaelchen/confluence-pages
  source_kind: folder
  promotion_status: reviewed_semantic_contract
